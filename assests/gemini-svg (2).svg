    <rect x="52" y="0" width="70" height="18" rx="4" fill="#050B19" stroke="#8B35FF" stroke-width="0.8" />
    <text x="87" y="12" fill="#F1F3F8" font-family="monospace" font-size="8" text-anchor="middle">Spring Boot</text>
    
    <rect x="128" y="0" width="72" height="18" rx="4" fill="#050B19" stroke="#8B35FF" stroke-width="0.8" />
    <text x="164" y="12" fill="#F1F3F8" font-family="monospace" font-size="8" text-anchor="middle">PostgreSQL</text>
  </g>
</svg>