<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 135" width="100%" height="auto">
  <rect x="1" y="1" width="238" height="133" rx="10" fill="#070D1C" stroke="#8B35FF" stroke-width="1.2" />
  <!-- Header -->
  <circle cx="20" cy="22" r="4" fill="#36E878" />
  <text x="32" y="25" fill="#F1F3F8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="12">Currently Building</text>
  <!-- Project Title -->
  <text x="20" y="52" fill="#00D9FF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="14">HookForge</text>
  <!-- One-line Description -->
  <text x="20" y="72" fill="#A0A8BC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9.5">Scalable Webhook Delivery & Orchestration</text>
